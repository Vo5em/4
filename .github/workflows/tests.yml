name: Tests

on:
  push:
  pull_request:

jobs:
  unit-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bot_test
          POSTGRES_DB: crypto_bot_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot_test -d crypto_bot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -v
        env:
          DATABASE_URL: postgresql+asyncpg://bot_test@127.0.0.1:5432/crypto_bot_test
          ADMIN_USER_ID: "4242"
          RUN_POSTGRES_INTEGRATION: "1"
